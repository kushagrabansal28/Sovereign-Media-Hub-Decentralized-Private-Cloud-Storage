<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410"><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="40" width="300" height="250" rx="6" fill="#f5f3ef" stroke="#9a5a0c" stroke-width="1.6"/><text x="44" y="64" font-size="14" font-weight="600" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">Client (browser)</text><text x="44" y="86" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">React 19, TypeScript</text><text x="44" y="104" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif"></text><text x="44" y="122" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">Identity: NIP-49 encrypted key</text><text x="44" y="140" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">or NIP-07 extension</text><text x="44" y="158" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">Signs: kind 24242, 1063, 5</text><text x="44" y="176" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">SHA-256 in a Web Worker</text><text x="44" y="194" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">Thumbnail, BlurHash</text><text x="44" y="212" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">Relay manager, outbox</text><text x="44" y="230" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">IndexedDB event cache</text><text x="44" y="248" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">Gallery, viewer, upload queue</text><rect x="420" y="40" width="300" height="110" rx="6" fill="#f5f3ef" stroke="#c5bfb4" stroke-width="1.2"/><text x="434" y="64" font-size="14" font-weight="600" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">Brains: Nostr relays</text><text x="434" y="86" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">Kind 1063 file metadata (NIP-94)</text><text x="434" y="104" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">Kind 5 deletions (NIP-09)</text><text x="434" y="122" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">No file bytes</text><rect x="420" y="190" width="300" height="100" rx="6" fill="#f5f3ef" stroke="#9a5a0c" stroke-width="1.6"/><text x="434" y="214" font-size="14" font-weight="600" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">Brawn: Blossom storage server</text><text x="434" y="236" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">Go, SQLite, blobs/ab/cd/&lt;sha256></text><text x="434" y="254" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">BUD-01, 02, 06, 11, 12</text><rect x="420" y="330" width="300" height="60" rx="6" fill="#f5f3ef" stroke="#c5bfb4" stroke-width="1.2"/><text x="434" y="354" font-size="14" font-weight="600" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">Caddy</text><text x="434" y="376" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">Static app, reverse proxy, TLS</text><line x1="330" y1="95" x2="412" y2="95" stroke="#1c1a17" stroke-width="1.3" /><polygon points="420,95 412,91 412,99" fill="#1c1a17"/><text x="375" y="87" font-size="11.5" text-anchor="middle" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">WebSocket: EVENT, REQ</text><line x1="420" y1="125" x2="338" y2="125" stroke="#1c1a17" stroke-width="1.3" stroke-dasharray="5 4"/><polygon points="330,125 338,121 338,129" fill="#1c1a17"/><text x="375" y="141" font-size="11.5" text-anchor="middle" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">events, EOSE</text><line x1="330" y1="235" x2="412" y2="235" stroke="#1c1a17" stroke-width="1.3" /><polygon points="420,235 412,231 412,239" fill="#1c1a17"/><text x="375" y="227" font-size="11.5" text-anchor="middle" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">HTTP PUT /upload, GET /&lt;sha256></text><line x1="420" y1="265" x2="338" y2="265" stroke="#1c1a17" stroke-width="1.3" stroke-dasharray="5 4"/><polygon points="330,265 338,261 338,269" fill="#1c1a17"/><text x="375" y="281" font-size="11.5" text-anchor="middle" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">descriptor, bytes</text><text x="30" y="330" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">The private key never leaves the client.</text><text x="30" y="350" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">Authorization is a signed event in the HTTP header.</text><text x="30" y="370" font-size="12" fill="#6a655d" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">Relays see metadata only; the server sees bytes.</text></svg>