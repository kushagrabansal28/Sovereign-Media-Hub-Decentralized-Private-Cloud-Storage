<svg xmlns="http://www.w3.org/2000/svg" width="980" height="624" viewBox="0 0 980 624"><rect width="100%" height="100%" fill="#ffffff"/><line x1="130" y1="52" x2="130" y2="610" stroke="#8EAADB" stroke-width="1.2" stroke-dasharray="4 5"/><rect x="60" y="14" width="140" height="38" rx="7" fill="#2E74B5"/><text x="130" y="38" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">Client</text><line x1="860" y1="52" x2="860" y2="610" stroke="#8EAADB" stroke-width="1.2" stroke-dasharray="4 5"/><rect x="790" y="14" width="140" height="38" rx="7" fill="#2E74B5"/><text x="860" y="38" font-size="14" font-weight="700" fill="#fff" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">Storage server</text><circle cx="30" cy="92" r="11" fill="#D9E2F3"/><text x="30" y="96.5" font-size="12" font-weight="700" fill="#1F3763" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">1</text><rect x="142" y="77" width="336" height="30" rx="6" fill="#EEF3FA" stroke="#8EAADB" stroke-width="1"/><text x="154" y="96.5" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">sign kind 24242 with t, x, expiration and server</text><circle cx="30" cy="134" r="11" fill="#D9E2F3"/><text x="30" y="138.5" font-size="12" font-weight="700" fill="#1F3763" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">2</text><line x1="130" y1="140" x2="852" y2="140" stroke="#1F3763" stroke-width="1.5" /><polygon points="860,140 851,135.5 851,144.5" fill="#1F3763"/><text x="495" y="128" font-size="13" font-weight="400" fill="#1F3763" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">DELETE /‹sha256›   Authorization: Nostr ‹base64url›</text><circle cx="30" cy="176" r="11" fill="#D9E2F3"/><text x="30" y="180.5" font-size="12" font-weight="700" fill="#1F3763" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">3</text><rect x="648" y="161" width="200" height="30" rx="6" fill="#EEF3FA" stroke="#8EAADB" stroke-width="1"/><text x="660" y="180.5" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">decode; size at most 16 KiB</text><circle cx="30" cy="218" r="11" fill="#D9E2F3"/><text x="30" y="222.5" font-size="12" font-weight="700" fill="#1F3763" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">4</text><rect x="460" y="203" width="388" height="30" rx="6" fill="#EEF3FA" stroke="#8EAADB" stroke-width="1"/><text x="472" y="222.5" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">kind is 24242; id equals hash(event); signature is valid</text><circle cx="30" cy="260" r="11" fill="#D9E2F3"/><text x="30" y="264.5" font-size="12" font-weight="700" fill="#1F3763" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">5</text><rect x="544" y="245" width="304" height="30" rx="6" fill="#EEF3FA" stroke="#8EAADB" stroke-width="1"/><text x="556" y="264.5" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">created_at is not in the future (60 s skew)</text><circle cx="30" cy="302" r="11" fill="#D9E2F3"/><text x="30" y="306.5" font-size="12" font-weight="700" fill="#1F3763" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">6</text><rect x="492" y="287" width="356" height="30" rx="6" fill="#EEF3FA" stroke="#8EAADB" stroke-width="1"/><text x="504" y="306.5" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">expiration is in the future and at most 1 hour away</text><circle cx="30" cy="344" r="11" fill="#D9E2F3"/><text x="30" y="348.5" font-size="12" font-weight="700" fill="#1F3763" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">7</text><rect x="531" y="329" width="317" height="30" rx="6" fill="#EEF3FA" stroke="#8EAADB" stroke-width="1"/><text x="543" y="348.5" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">exactly one t tag, equal to the endpoint verb</text><circle cx="30" cy="386" r="11" fill="#D9E2F3"/><text x="30" y="390.5" font-size="12" font-weight="700" fill="#1F3763" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">8</text><rect x="642" y="371" width="206" height="30" rx="6" fill="#EEF3FA" stroke="#8EAADB" stroke-width="1"/><text x="654" y="390.5" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">server tag matches this host</text><circle cx="30" cy="428" r="11" fill="#D9E2F3"/><text x="30" y="432.5" font-size="12" font-weight="700" fill="#1F3763" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">9</text><rect x="616" y="413" width="232" height="30" rx="6" fill="#EEF3FA" stroke="#8EAADB" stroke-width="1"/><text x="628" y="432.5" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">x tag equals the hash in the URL</text><circle cx="30" cy="470" r="11" fill="#D9E2F3"/><text x="30" y="474.5" font-size="12" font-weight="700" fill="#1F3763" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">10</text><rect x="544" y="455" width="304" height="30" rx="6" fill="#EEF3FA" stroke="#8EAADB" stroke-width="1"/><text x="556" y="474.5" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">the token has not been used before (delete)</text><circle cx="30" cy="512" r="11" fill="#D9E2F3"/><text x="30" y="516.5" font-size="12" font-weight="700" fill="#1F3763" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">11</text><rect x="434" y="497" width="414" height="30" rx="6" fill="#EEF3FA" stroke="#8EAADB" stroke-width="1"/><text x="446" y="516.5" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">caller owns the blob: remove ownership, and the file if last</text><circle cx="30" cy="554" r="11" fill="#D9E2F3"/><text x="30" y="558.5" font-size="12" font-weight="700" fill="#1F3763" text-anchor="middle" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">12</text><line x1="860" y1="560" x2="138" y2="560" stroke="#44546A" stroke-width="1.5" stroke-dasharray="6 4"/><polygon points="130,560 139,555.5 139,564.5" fill="#44546A"/><text x="495" y="548" font-size="13" font-weight="400" fill="#44546A" text-anchor="middle" stroke="#fff" stroke-width="5" paint-order="stroke" stroke-linejoin="round" font-family="Calibri, Carlito, 'Segoe UI', Arial, sans-serif">200 {file_removed, owners_remaining}, or 401 / 404</text></svg>