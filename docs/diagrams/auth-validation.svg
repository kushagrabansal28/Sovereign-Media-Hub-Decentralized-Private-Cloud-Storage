<svg xmlns="http://www.w3.org/2000/svg" width="900" height="532" viewBox="0 0 900 532"><rect width="100%" height="100%" fill="#ffffff"/><rect x="-22" y="14" width="124" height="30" rx="5" fill="#f5f3ef" stroke="#c5bfb4"/><text x="40" y="34" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">Client</text><line x1="40" y1="44" x2="40" y2="522" stroke="#c5bfb4" stroke-width="1" stroke-dasharray="3 4"/><rect x="798" y="14" width="124" height="30" rx="5" fill="#f5f3ef" stroke="#c5bfb4"/><text x="860" y="34" font-size="12.5" font-weight="600" text-anchor="middle" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">Storage server</text><line x1="860" y1="44" x2="860" y2="522" stroke="#c5bfb4" stroke-width="1" stroke-dasharray="3 4"/><text x="48" y="74" font-size="11.5" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">sign kind 24242 with t, x, expiration, server</text><line x1="40" y1="110" x2="852" y2="110" stroke="#1c1a17" stroke-width="1.3" /><polygon points="860,110 852,106 852,114" fill="#1c1a17"/><text x="450" y="104" font-size="11.5" text-anchor="middle" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">DELETE /&lt;sha256>  Authorization: Nostr &lt;base64url></text><text x="868" y="146" font-size="11.5" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">1. decode, size ≤ 16 KiB</text><text x="868" y="182" font-size="11.5" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">2. kind = 24242; id = hash(event); signature valid</text><text x="868" y="218" font-size="11.5" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">3. created_at not in the future (60 s skew)</text><text x="868" y="254" font-size="11.5" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">4. expiration in the future, ≤ 1 h</text><text x="868" y="290" font-size="11.5" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">5. exactly one t tag = endpoint verb</text><text x="868" y="326" font-size="11.5" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">6. server tag matches this host</text><text x="868" y="362" font-size="11.5" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">7. x tag equals the hash in the URL</text><text x="868" y="398" font-size="11.5" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">8. token not used before (delete)</text><text x="868" y="434" font-size="11.5" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">9. caller owns the blob; remove ownership; file if last</text><line x1="860" y1="470" x2="48" y2="470" stroke="#1c1a17" stroke-width="1.3" stroke-dasharray="5 4"/><polygon points="40,470 48,466 48,474" fill="#1c1a17"/><text x="450" y="464" font-size="11.5" text-anchor="middle" fill="#1c1a17" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">200 {file_removed, owners_remaining} or 401 / 404</text></svg>