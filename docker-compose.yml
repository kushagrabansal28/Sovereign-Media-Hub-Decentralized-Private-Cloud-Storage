services:
  server:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATA_DIR: /data
      BASE_URL: ${PUBLIC_URL:-http://localhost}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-104857600}
      ALLOWED_PUBKEYS: ${ALLOWED_PUBKEYS:-}
      TRUST_PROXY: "true"
    volumes:
      - media:/data
    # Only the proxy can reach the server; nothing is published to the host.
    expose:
      - "8787"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "server", "-healthcheck"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      DEFAULT_RELAYS: ${DEFAULT_RELAYS:-[]}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

volumes:
  media:
  caddy_data:
  caddy_config:
